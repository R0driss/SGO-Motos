{% extends 'base.html' %}

{% block titulo %}
Login
{% endblock %}

{% block conteudo %}

<div class="form-box">

<h2>Login</h2>

<form method="POST">

    <input
    type="text"
    name="usuario"
    placeholder="Usuário"
    required>

    <input
    type="password"
    name="senha"
    placeholder="Senha"
    required>

    <button type="submit">

        Entrar

    </button>
    
   <a href="{{ url_for('auth.esqueci_senha') }}">
    Esqueci minha senha
</a>

</form>

</div>

{% endblock %}
